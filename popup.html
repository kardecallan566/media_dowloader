<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Finder Pro</title>
<style>
:root{color-scheme:dark;--bg:#090d19;--panel:#111829;--line:#273248;--text:#f5f7ff;--muted:#96a4bc;--accent:#8b70fb;--accent2:#c7baff;--green:#34d399}
*{box-sizing:border-box}
body{width:420px;min-height:360px;max-height:640px;margin:0;overflow-y:auto;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
button,summary{cursor:pointer;font:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent2);outline-offset:3px}
.app{padding:17px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#4f8df9);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 4px 18px #6137d733}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.55px;line-height:1.2}
.brand-sub{color:var(--muted);font-size:10px;margin-top:2px}
.header-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:#151d30;color:#cdd7ee;font-size:15px}
.icon-btn:hover{background:#222c46}
.page-banner{padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(130deg,#192038,#121a2d);display:flex;align-items:center;gap:11px}
.page-avatar{background:#2d3655;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#d8ccff}
.page-info{min-width:0;flex:1}
.page-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-desc{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiny-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0 12px;padding:5px;border-radius:13px;background:#131b2d}
.tab{border:0;background:transparent;border-radius:10px;color:#a8b6d0;padding:10px 6px;font-size:12px;font-weight:700}
.tab.active{color:#fff;background:#34305c;box-shadow:0 2px 8px #0002}
.tab .count{font-weight:700;color:#d8cfff;margin-left:3px}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin:13px 1px 9px;gap:10px}
.section-title{font-size:12px;font-weight:800;color:#e8edfd}
.section-hint{font-size:10px;color:var(--muted)}
.media-list{display:flex;flex-direction:column;gap:8px}
.media-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}
.media-line{display:flex;gap:11px;align-items:center}
.preview{width:79px;height:74px;flex:0 0 79px;border-radius:10px;background:#222d44;overflow:hidden;display:grid;place-items:center;color:#cbbfff;font-size:25px}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.media-main{flex:1;min-width:0}
.media-title{font-weight:750;font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-sub{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.chip{font-size:10px;border-radius:6px;padding:2px 6px;background:#232e45;color:#c7d2ea}
.chip.primary{background:#302756;color:#cbbcff}
.media-host{margin-top:5px;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-actions{margin-top:10px;display:flex;gap:8px}
.download-btn{flex:1;border:0;border-radius:9px;padding:9px 12px;color:#fff;font-weight:800;background:linear-gradient(120deg,#815ef9,#717efb)}
.download-btn:hover:not(:disabled){filter:brightness(1.1)}
.cancel-btn{border:1px solid #42374b;color:#f7b3c0;background:#241b2b;border-radius:9px;padding:8px 12px}
.state{font-size:11px;color:#a8b7d2;margin-top:9px}
.state.error{color:#fca5a5}
.track{height:5px;border-radius:8px;background:#2a3450;overflow:hidden;margin-top:7px}
.fill{height:100%;background:linear-gradient(90deg,#8b5cf6,#38bdf8);transition:width .2s}
details{margin-top:7px;color:#8794ad;font-size:10px}
details summary{list-style:none;width:max-content}
details summary:hover{color:#e2dcff}
details .raw-url{margin-top:6px;word-break:break-all;font-family:monospace;color:#a0b4d5;max-height:90px;overflow:auto}
.more-btn{display:block;width:100%;padding:10px;margin-top:10px;background:#151e31;border:1px dashed #3d4860;color:#c5ceea;border-radius:11px;font-weight:750}
.more-btn:hover{background:#202b43}
.empty{text-align:center;background:#11192a;border:1px dashed #344059;border-radius:15px;padding:28px 22px;margin-top:10px}
.empty-icon{font-size:29px;margin-bottom:9px}
.empty strong{display:block;font-size:14px;margin-bottom:6px}
.empty p{margin:0;color:var(--muted);font-size:12px}
.notice{font-size:11px;color:#93a2c0;margin-top:12px;line-height:1.55}
.footer{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;color:#667993;font-size:10px}
#toast{display:none;background:#402236;border:1px solid #874464;color:#ffd5de;padding:10px;border-radius:10px;margin-top:12px;font-size:11px}
#toast:not(:empty){display:block}
.chip.verified{background:#12372f;color:#79e2b9}.chip.warning{background:#493022;color:#ffd29d}.state.error{color:#fda4af}.player-candidates{margin-top:12px;padding:12px;background:#0b1223;border:1px solid #33405d;border-radius:12px;display:flex;flex-direction:column;gap:8px}
.player-candidates .media-card{background:#151f32;padding:10px}
.local-download{background:linear-gradient(120deg,#135b72,#266b88)}
.native-actions .cancel-btn{white-space:nowrap}
.cookie-consent{display:flex;align-items:flex-start;gap:9px;margin:10px 0 3px;color:#ccd6e9;font-size:11px;line-height:1.45;cursor:pointer}.cookie-consent input{margin:2px 0 0;accent-color:#8170f6;flex-shrink:0}.local-download:disabled{background:#243550;color:#a2b2c7;opacity:.86}.manual-post{margin:11px 0 6px;padding:10px 11px;background:#151f32;border:1px solid #2c3b59;border-radius:10px}.manual-post .section-title{margin-bottom:7px}.manual-post-input{width:100%;height:36px;border:1px solid #445473;border-radius:8px;background:#0b1324;color:#e9effd;font:12px system-ui;padding:0 9px;outline:none}.manual-post-input:focus{border-color:#8b70fb}.manual-post-input::placeholder{color:#7586a4}.session-choice{margin:11px 0;padding:10px 11px;border:1px solid #2a3c5a;background:#111b2f;border-radius:10px}.session-label{display:block;margin-bottom:7px;color:#dce5f8;font-size:11px;font-weight:700}.session-select{width:100%;min-height:36px;padding:7px 9px;background:#0e1627;border:1px solid #415273;color:#e2eafb;border-radius:8px;font-size:11px;outline:none}.session-select:focus{border-color:#9988ff}.session-choice .notice{margin-top:7px}</style>
</head>
<body>
<div class="app">
 <header>
  <div class="brand"><div class="brand-mark" aria-hidden="true">▶</div><div><div class="brand-name">Media Finder <span style="color:#afa0ff">Pro</span></div><div class="brand-sub">Suas mídias, sem complicação</div></div></div>
  <div class="header-actions"><button id="refresh" class="icon-btn" title="Atualizar mídias" aria-label="Atualizar">↻</button><button id="clear" class="icon-btn" title="Limpar lista e procurar novamente" aria-label="Limpar">⌫</button></div>
 </header>
 <div class="page-banner"><div class="page-avatar" id="pageInitial">🌐</div><div class="page-info"><div id="pageTitle" class="page-name">Página atual</div><div id="pageAddress" class="page-desc">Detectando arquivos disponíveis...</div></div><span class="tiny-dot" title="Detecção ativa"></span></div>
 <nav class="tabs" aria-label="Tipo de mídia">
  <button type="button" class="tab active" data-kind="video">▶ Vídeos <span class="count" id="videoCount"></span></button>
  <button type="button" class="tab" data-kind="image">▧ Imagens <span class="count" id="imageCount"></span></button>
  <button type="button" class="tab" data-kind="audio">♫ Áudios <span class="count" id="audioCount"></span></button>
 </nav>
 <div id="list"></div>
 <div id="toast" role="alert"></div>
 <div class="footer"><span>Media Finder Pro · v1.11.0</span><span>Arquivos sem DRM</span></div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
